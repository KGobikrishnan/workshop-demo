{% extends 'base.html' %}

{% block title %}Authentication Portal{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="vvk-card p-4 p-md-5 text-center position-relative">
            <!-- Glow background effect -->
            <div style="position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 140px; height: 140px; background: var(--primary-accent); filter: blur(70px); opacity: 0.35; z-index: 0; pointer-events: none;"></div>

            <div class="position-relative" style="z-index: 1;">
                <div class="d-inline-flex p-3 rounded-4 mb-3" style="background: var(--primary-gradient);">
                    <i class="bi bi-mortarboard-fill fs-1 text-white"></i>
                </div>
                
                <h2 class="fw-bold text-light mb-1">VVK Project Hub</h2>
                <p class="text-muted small mb-4">Vivekanandha College Multi-Project Integrated System</p>

                <!-- Helpful Credentials Callout -->
                <div class="p-3 mb-4 rounded-3 text-start border border-primary border-opacity-25" style="background: rgba(99, 102, 241, 0.08);">
                    <div class="d-flex align-items-center gap-2 mb-1">
                        <i class="bi bi-key-fill text-warning"></i>
                        <strong class="text-light small">Default Credentials:</strong>
                    </div>
                    <div class="d-flex justify-content-between text-muted small">
                        <span>Username: <code class="text-info fw-bold">user</code></span>
                        <span>Password: <code class="text-info fw-bold">1234</code></span>
                    </div>
                </div>

                <form method="POST" action="{{ url_for('login') }}" class="text-start">
                    <div class="mb-3">
                        <label class="form-label small text-muted fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary border-opacity-25 text-muted"><i class="bi bi-person-fill"></i></span>
                            <input type="text" name="username" class="form-control vvk-input" value="user" required autofocus placeholder="Enter username">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small text-muted fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary border-opacity-25 text-muted"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" name="password" class="form-control vvk-input" value="1234" required placeholder="Enter password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-vvk-primary w-100 py-2 fs-6 d-flex align-items-center justify-content-center gap-2">
                        <span>Access VVK Portal</span>
                        <i class="bi bi-arrow-right-circle-fill"></i>
                    </button>
                </form>

                <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center text-muted small">
                    <i class="bi bi-database-check text-success me-1"></i> Connected to PostgreSQL Database (<code>vvk</code>)
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
